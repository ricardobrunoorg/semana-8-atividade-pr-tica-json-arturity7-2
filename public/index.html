<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catálogo de Filmes e Séries</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 700px;
      margin: 40px auto;
      background-color: #f4f4f4;
      color: #333;
    }

    h1 {
      color: #222;
    }

    p.instrucao {
      background-color: #fff3cd;
      border-left: 4px solid #ffc107;
      padding: 10px 16px;
      border-radius: 4px;
    }

    #output {
      background-color: #ffffff;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1>🎬 Catálogo de Filmes e Séries</h1>

  <p class="instrucao">
    📋 Abra o Console do navegador (pressione <strong>F12</strong> e clique em "Console")
    para ver os resultados detalhados.
  </p>

  <div id="output">
    <!-- O resumo gerado pelo script.js vai aparecer aqui -->
  </div>

  <script src="script.js"></script>

</body>
</html>
